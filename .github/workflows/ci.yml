name: Foundation CI
on:
  pull_request:
  push:
    branches: [feature/cosmic-match-foundation]
permissions:
  contents: read
jobs:
  verify:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [test, typecheck, build]
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Generate Peru geography fixture from GeoNames
        if: matrix.check == 'build'
        run: GEOGRAPHY_COUNTRIES=PE python3 scripts/build-geography.py
      - name: Validate generated geography catalog
        if: matrix.check == 'build'
        run: node --test tests/geography-catalog.test.mjs
      - name: Runtime diagnostics
        run: node --version && npm --version
      - name: Run check and retain diagnostics
        shell: bash
        run: |
          set +e
          npm run "${{ matrix.check }}" > diagnostics.txt 2>&1
          result=$?
          cat diagnostics.txt
          if [ "$result" -ne 0 ]; then
            tail -n 60 diagnostics.txt >> "$GITHUB_STEP_SUMMARY"
            echo "::error::${{ matrix.check }} failed; inspect job summary"
          fi
          exit "$result"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.check }}
          path: diagnostics.txt
          if-no-files-found: warn

      - name: Verify static entrypoint
        if: matrix.check == 'build'
        run: test -s out/index.html
      - name: Upload runnable static website
        if: matrix.check == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: astralis-web-preview
          path: out/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Install browser test runtime
        if: matrix.check == 'build'
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test desktop and mobile browser journey
        if: matrix.check == 'build'
        run: node tests/browser-smoke.mjs
      - name: Upload browser screenshots
        if: always() && matrix.check == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: browser-preview
          path: browser-*.png
          if-no-files-found: warn
          retention-days: 7
