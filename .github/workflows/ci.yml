name: Foundation CI
on:
  pull_request:
  push:
    branches: [feature/cosmic-match-foundation]
permissions:
  contents: read
jobs:
  verify:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [test, typecheck, build]
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Runtime diagnostics
        run: node --version && npm --version
      - name: Run check and retain diagnostics
        shell: bash
        run: |
          set +e
          npm run "${{ matrix.check }}" > diagnostics.txt 2>&1
          result=$?
          cat diagnostics.txt
          if [ "$result" -ne 0 ]; then
            tail -n 60 diagnostics.txt >> "$GITHUB_STEP_SUMMARY"
            echo "::error::${{ matrix.check }} failed; inspect job summary"
          fi
          exit "$result"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.check }}
          path: diagnostics.txt
          if-no-files-found: warn
